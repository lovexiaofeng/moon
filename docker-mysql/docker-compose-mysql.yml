version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456  # 修改为你的 root 密码
      MYSQL_DATABASE: moon              # 初始化数据库名
      MYSQL_USER: moon_user             # 新建用户名
      MYSQL_PASSWORD: moon_password     # 新建用户密码
      TZ: Asia/Shanghai                 # 时区设置
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # 初始化 SQL 文件（可选）
    networks:
      - moon_network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000

volumes:
  mysql_data:
    driver: local

networks:
  moon_network:
    driver: bridge
